    <script>
      // Paint the stored theme before first render, so a dark-mode visitor
      // never sees a white flash while the React bundle boots.
      (function () {
        try {
          var stored = localStorage.getItem('salam-theme');
          var light = stored
            ? stored === 'light'
            : window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.setAttribute('data-theme', light ? 'salam-light' : 'salam-dark');
          document.documentElement.style.colorScheme = light ? 'light' : 'dark';
          document.documentElement.style.backgroundColor = light ? '#f6f8fc' : '#060911';
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'salam-dark');
        }
      })();
    </script>
</head>

<body>
    <script>
      // Restore path encoded by 404.html for GitHub Pages SPA routing
      (function () {
        var p = new URLSearchParams(window.location.search).get('p');
        if (p) {
          var q = new URLSearchParams(window.location.search).get('q');
          window.history.replaceState(
            null, null,
            window.location.pathname + '/' + p.replace(/~and~/g, '&') +
            (q ? '?' + q.replace(/~and~/g, '&') : '') +
            window.location.hash
          );
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
