<!doctype html>
<!-- data-theme pins daisyUI to its light palette. Without it, daisyUI
     swaps to dark on the OS preference while the app's own hardcoded light
     backgrounds stay put, which renders input text near-white on white. -->
<html lang="en" data-theme="light">

<head>

    <link rel="icon" type="image/png" href="/portfolio/logo.png" />

        /* Google font - Work Sans */
    </style>

    <title>Eng. Abdul Salam</title>
  <script type="module" crossorigin src="/portfolio/assets/index-D_Ol3Dyy.js"></script>
  <link rel="stylesheet" crossorigin href="/portfolio/assets/index-CbOQdwvl.css">
</head>

<body class="">
    <script>
      // Restore path encoded by 404.html for GitHub Pages SPA routing
      (function () {
        var p = new URLSearchParams(window.location.search).get('p');
        if (p) {
          var q = new URLSearchParams(window.location.search).get('q');
          window.history.replaceState(
            null, null,
            window.location.pathname + '/' + p.replace(/~and~/g, '&') +
            (q ? '?' + q.replace(/~and~/g, '&') : '') +
            window.location.hash
          );
        }
      })();
    </script>
    <div id="root" class=""></div>
    <script type="module" src="https://unpkg.com/cally"></script>
</body>

</html>
